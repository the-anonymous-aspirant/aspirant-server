# Build and push the aspirant-server image to GHCR on every push to main.
# Test/validation is local-only (per #107 strip of ci.yml); this workflow
# carries ONLY the build+push half so the deploy pipeline isn't blocked.

name: Build Image

on:
  push:
    branches: [main]

# Serialize builds per ref so two merges landing seconds apart can't push
# :latest out of commit order (#4761: 1651e02's build finished 14s after
# cc3f520's own, so :latest resolved to the older commit and left a
# supposedly-removed proxy live). cancel-in-progress: false queues the
# second run behind the first instead of racing it, so :latest always
# lands from whichever push was queued (== merged) last.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile-Server
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
